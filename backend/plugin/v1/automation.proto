syntax = "proto3";

package plugin.v1;

option go_package = "xiaoheiplay/plugin/v1;pluginv1";

import "plugin/v1/types.proto";

service AutomationService {
  // Catalog sync
  rpc ListAreas(Empty) returns (ListAreasResponse);
  rpc ListLines(Empty) returns (ListLinesResponse);
  rpc ListPackages(ListPackagesRequest) returns (ListPackagesResponse);
  rpc ListImages(ListImagesRequest) returns (ListImagesResponse);

  // Catalog write-back (optional)
  rpc UpsertPackage(UpsertPackageRequest) returns (OperationResult);
  rpc DeletePackage(DeletePackageRequest) returns (OperationResult);

  // Instance lifecycle
  rpc CreateInstance(CreateInstanceRequest) returns (CreateInstanceResponse);
  rpc GetInstance(GetInstanceRequest) returns (GetInstanceResponse);
  rpc ListInstancesSimple(ListInstancesSimpleRequest) returns (ListInstancesSimpleResponse);
  rpc Start(StartRequest) returns (OperationResult);
  rpc Shutdown(ShutdownRequest) returns (OperationResult);
  rpc Reboot(RebootRequest) returns (OperationResult);
  rpc Rebuild(RebuildRequest) returns (OperationResult);
  rpc ResetPassword(ResetPasswordRequest) returns (OperationResult);
  rpc ElasticUpdate(ElasticUpdateRequest) returns (OperationResult);
  rpc Lock(LockRequest) returns (OperationResult);
  rpc Unlock(UnlockRequest) returns (OperationResult);
  rpc Renew(RenewRequest) returns (OperationResult);
  rpc Destroy(DestroyRequest) returns (OperationResult);
  rpc GetPanelURL(GetPanelURLRequest) returns (GetPanelURLResponse);
  rpc GetVNCURL(GetVNCURLRequest) returns (GetVNCURLResponse);
  rpc GetMonitor(GetMonitorRequest) returns (GetMonitorResponse);

  // Port mapping (optional)
  rpc ListPortMappings(ListPortMappingsRequest) returns (ListPortMappingsResponse);
  rpc AddPortMapping(AddPortMappingRequest) returns (OperationResult);
  rpc DeletePortMapping(DeletePortMappingRequest) returns (OperationResult);
  rpc FindPortCandidates(FindPortCandidatesRequest) returns (FindPortCandidatesResponse);

  // Backup (optional)
  rpc ListBackups(ListBackupsRequest) returns (ListBackupsResponse);
  rpc CreateBackup(CreateBackupRequest) returns (OperationResult);
  rpc DeleteBackup(DeleteBackupRequest) returns (OperationResult);
  rpc RestoreBackup(RestoreBackupRequest) returns (OperationResult);

  // Snapshot (optional)
  rpc ListSnapshots(ListSnapshotsRequest) returns (ListSnapshotsResponse);
  rpc CreateSnapshot(CreateSnapshotRequest) returns (OperationResult);
  rpc DeleteSnapshot(DeleteSnapshotRequest) returns (OperationResult);
  rpc RestoreSnapshot(RestoreSnapshotRequest) returns (OperationResult);

  // Firewall (optional)
  rpc ListFirewallRules(ListFirewallRulesRequest) returns (ListFirewallRulesResponse);
  rpc AddFirewallRule(AddFirewallRuleRequest) returns (OperationResult);
  rpc UpdateFirewallRule(UpdateFirewallRuleRequest) returns (OperationResult);
  rpc DeleteFirewallRule(DeleteFirewallRuleRequest) returns (OperationResult);
  rpc SetFirewallOptions(SetFirewallOptionsRequest) returns (OperationResult);

  // Network cards (optional)
  rpc ListNetworkCards(ListNetworkCardsRequest) returns (ListNetworkCardsResponse);
  rpc CreateNetworkCard(CreateNetworkCardRequest) returns (OperationResult);
  rpc UpdateNetworkCard(UpdateNetworkCardRequest) returns (OperationResult);
  rpc DeleteNetworkCard(DeleteNetworkCardRequest) returns (OperationResult);

  // Data disks (optional)
  rpc ListDataDisks(ListDataDisksRequest) returns (ListDataDisksResponse);
  rpc AttachDataDisk(AttachDataDiskRequest) returns (OperationResult);
  rpc DetachDataDisk(DetachDataDiskRequest) returns (OperationResult);
  rpc DeleteDataDisk(DeleteDataDiskRequest) returns (OperationResult);

  // ISO images (optional)
  rpc ListISOs(ListISOsRequest) returns (ListISOsResponse);
  rpc MountISO(MountISORequest) returns (OperationResult);
  rpc UnmountISO(UnmountISORequest) returns (OperationResult);

  // Reverse proxy (optional)
  rpc ListReverseProxies(ListReverseProxiesRequest) returns (ListReverseProxiesResponse);
  rpc CreateReverseProxy(CreateReverseProxyRequest) returns (OperationResult);
  rpc UpdateReverseProxy(UpdateReverseProxyRequest) returns (OperationResult);
  rpc DeleteReverseProxy(DeleteReverseProxyRequest) returns (OperationResult);

  // Boot order (optional)
  rpc GetBootOrder(GetBootOrderRequest) returns (GetBootOrderResponse);
  rpc SetBootOrder(SetBootOrderRequest) returns (OperationResult);

  // PCI / USB passthrough (optional)
  rpc ListPCIDevices(ListPCIDevicesRequest) returns (ListPCIDevicesResponse);
  rpc SetupPCIDevice(SetupPCIDeviceRequest) returns (OperationResult);
  rpc ListUSBDevices(ListUSBDevicesRequest) returns (ListUSBDevicesResponse);
  rpc SetupUSBDevice(SetupUSBDeviceRequest) returns (OperationResult);
}

message OperationResult {
  bool ok = 1;
  string error_code = 2;
  string error_message = 3;
}

message AutomationArea {
  int64 id = 1;
  string name = 2;
  int32 state = 3;
}

message AutomationLine {
  int64 id = 1;
  string name = 2;
  int64 area_id = 3;
  int32 state = 4;
}

message AutomationPackage {
  int64 id = 1;
  string name = 2;
  int32 cpu = 3;
  int32 memory_gb = 4;
  int32 disk_gb = 5;
  int32 bandwidth_mbps = 6;
  int32 port_num = 7;
  int64 monthly_price = 8;
  optional int32 capacity_remaining = 9;
}

message AutomationImage {
  int64 id = 1;
  string name = 2;
  string type = 3;
}

message AutomationInstance {
  int64 id = 1;
  string name = 2;
  int32 state = 3;
  int32 cpu = 4;
  int32 memory_gb = 5;
  int32 disk_gb = 6;
  int32 bandwidth_mbps = 7;
  string remote_ip = 8;
  string panel_password = 9;
  string vnc_password = 10;
  string os_password = 11;
  int64 expire_at_unix = 12;
}

message ListAreasResponse { repeated AutomationArea items = 1; }
message ListLinesResponse { repeated AutomationLine items = 1; }

message ListPackagesRequest { int64 line_id = 1; }
message ListPackagesResponse { repeated AutomationPackage items = 1; }

message ListImagesRequest { int64 line_id = 1; }
message ListImagesResponse { repeated AutomationImage items = 1; }

// ---- Catalog write-back ----
// UpsertPackageRequest 映射 HostAgent POST /api/server/plan/<hs_name>
// line_id 由插件反查为 hs_name；package_name 直接作为 HostAgent plan_name（业务稳定键）。
message UpsertPackageRequest {
  int64 line_id = 1;
  string package_name = 2;
  int32 cpu = 3;
  int32 memory_gb = 4;
  int32 disk_gb = 5;
  int32 bandwidth_mbps = 6;
  int32 traffic_gb = 7;
  int32 gpu_mem_gb = 8;
}

// DeletePackageRequest 映射 HostAgent DELETE /api/server/plan/<hs_name>/<plan_name>
message DeletePackageRequest {
  int64 line_id = 1;
  string package_name = 2;
}

message CreateInstanceRequest {
  int64 line_id = 1;
  // For providers that support SKU/package based provisioning (optional).
  int64 package_id = 2;
  // image_id is preferred; os is a legacy alternative.
  int64 image_id = 3;
  string name = 4;
  string os = 5;
  // password is the OS password; some providers may accept separate panel/vnc passwords.
  string password = 6;
  string vnc_password = 7;
  int64 expire_at_unix = 8;
  int32 port_num = 9;
  // For providers that require explicit resource specs (optional).
  int32 cpu = 10;
  int32 memory_gb = 11;
  int32 disk_gb = 12;
  int32 bandwidth_mbps = 13;
}
message CreateInstanceResponse { int64 instance_id = 1; }

message GetInstanceRequest { int64 instance_id = 1; }
message GetInstanceResponse { AutomationInstance instance = 1; }

message AutomationInstanceSimple {
  int64 id = 1;
  string name = 2;
  string ip = 3;
}
message ListInstancesSimpleRequest { string search_tag = 1; }
message ListInstancesSimpleResponse { repeated AutomationInstanceSimple items = 1; }

message StartRequest { int64 instance_id = 1; }
message ShutdownRequest { int64 instance_id = 1; }
message RebootRequest { int64 instance_id = 1; }

message RebuildRequest {
  int64 instance_id = 1;
  int64 image_id = 2;
  string password = 3;
}

message ResetPasswordRequest { int64 instance_id = 1; string password = 2; }

message ElasticUpdateRequest {
  int64 instance_id = 1;
  optional int32 cpu = 2;
  optional int32 memory_gb = 3;
  optional int32 disk_gb = 4;
  optional int32 bandwidth_mbps = 5;
  optional int32 port_num = 6;
}
message LockRequest { int64 instance_id = 1; }
message UnlockRequest { int64 instance_id = 1; }

message RenewRequest { int64 instance_id = 1; int64 next_due_at_unix = 2; }
message DestroyRequest { int64 instance_id = 1; }

message GetPanelURLRequest { string instance_name = 1; string panel_password = 2; }
message GetPanelURLResponse { string url = 1; }

message GetVNCURLRequest { int64 instance_id = 1; }
message GetVNCURLResponse { string url = 1; }

message GetMonitorRequest { int64 instance_id = 1; }
message GetMonitorResponse { string raw_json = 1; }

message AutomationPortMapping {
  int64 id = 1;
  string name = 2;
  // sport (public port) is provider-specific and may be a range (e.g. "20000-20010").
  string sport = 3;
  int64 dport = 4;
}

message ListPortMappingsRequest { int64 instance_id = 1; }
message ListPortMappingsResponse { repeated AutomationPortMapping items = 1; }
message AddPortMappingRequest {
  int64 instance_id = 1;
  string name = 2;
  string sport = 3;
  int64 dport = 4;
}
message DeletePortMappingRequest { int64 instance_id = 1; int64 mapping_id = 2; }
message FindPortCandidatesRequest { int64 instance_id = 1; string keywords = 2; }
message FindPortCandidatesResponse { repeated int64 ports = 1; }

message AutomationBackup {
  int64 id = 1;
  string name = 2;
  int64 created_at_unix = 3;
  int32 state = 4;
}
message ListBackupsRequest { int64 instance_id = 1; }
message ListBackupsResponse { repeated AutomationBackup items = 1; }
message CreateBackupRequest { int64 instance_id = 1; }
message DeleteBackupRequest { int64 instance_id = 1; int64 backup_id = 2; }
message RestoreBackupRequest { int64 instance_id = 1; int64 backup_id = 2; }

message AutomationSnapshot {
  int64 id = 1;
  string name = 2;
  int64 created_at_unix = 3;
  int32 state = 4;
  string description = 5;
  // current 表示是否为平台当前快照（PVE / libvirt 可回滚到该点）
  bool current = 6;
  // platform_state 平台原始状态文本（如 running / shutoff）
  string platform_state = 7;
}
message ListSnapshotsRequest { int64 instance_id = 1; }
message ListSnapshotsResponse { repeated AutomationSnapshot items = 1; }
message CreateSnapshotRequest {
  int64 instance_id = 1;
  // name 为空时由平台生成默认快照名
  string name = 2;
  string description = 3;
}
message DeleteSnapshotRequest { int64 instance_id = 1; int64 snapshot_id = 2; }
message RestoreSnapshotRequest { int64 instance_id = 1; int64 snapshot_id = 2; }

// AutomationFirewallRule 对应平台虚拟机防火墙规则：
//   - direction 等价 type：in / out
//   - method    等价 action：ACCEPT / DROP / REJECT
//   - protocol  等价 proto：tcp / udp / icmp / 空=任意
//   - ip        等价 source
//   - port      等价 dport，支持 "80" / "8000:9000"
//   - priority  等价规则位序 pos（平台按位序求值）
// 其余字段（dest/sport/comment/macro/iface）按平台原样透传。
message AutomationFirewallRule {
  int64 id = 1;
  string direction = 2;
  string protocol = 3;
  string method = 4;
  string port = 5;
  string ip = 6;
  int32 priority = 7;
  bool enable = 8;
  string dest = 9;
  string sport = 10;
  string comment = 11;
  string macro = 12;
  string iface = 13;
}
// AutomationFirewallState 虚拟机防火墙整体状态
message AutomationFirewallState {
  bool enabled = 1;
  string policy_in = 2;
  string policy_out = 3;
  bool effective = 4;
  string platform = 5;
}
message ListFirewallRulesRequest { int64 instance_id = 1; }
message ListFirewallRulesResponse {
  repeated AutomationFirewallRule items = 1;
  AutomationFirewallState state = 2;
}
message AddFirewallRuleRequest {
  int64 instance_id = 1;
  string direction = 2;
  string protocol = 3;
  string method = 4;
  string port = 5;
  string ip = 6;
  int32 priority = 7;
  bool enable = 8;
  string dest = 9;
  string sport = 10;
  string comment = 11;
  string macro = 12;
  string iface = 13;
}
message UpdateFirewallRuleRequest {
  int64 instance_id = 1;
  int64 rule_id = 2;
  string direction = 3;
  string protocol = 4;
  string method = 5;
  string port = 6;
  string ip = 7;
  bool enable = 8;
  string dest = 9;
  string sport = 10;
  string comment = 11;
  string macro = 12;
  string iface = 13;
}
message DeleteFirewallRuleRequest { int64 instance_id = 1; int64 rule_id = 2; }
message SetFirewallOptionsRequest {
  int64 instance_id = 1;
  bool enable = 2;
  string policy_in = 3;
  string policy_out = 4;
}

// ---- 网卡 ----
// AutomationNetworkCard 对应平台网卡配置（IP / MAC / 网关 / DNS）。
message AutomationNetworkCard {
  string nic_name = 1;
  string nic_type = 2;
  string mac_addr = 3;
  string ip4_addr = 4;
  string ip6_addr = 5;
  string nic_gate = 6;
  string nic_mask = 7;
  repeated string dns_addr = 8;
  int32 ip6_prefix = 9;
}
message ListNetworkCardsRequest { int64 instance_id = 1; }
message ListNetworkCardsResponse { repeated AutomationNetworkCard items = 1; }
message CreateNetworkCardRequest {
  int64 instance_id = 1;
  AutomationNetworkCard card = 2;
}
message UpdateNetworkCardRequest {
  int64 instance_id = 1;
  string nic_name = 2;
  AutomationNetworkCard card = 3;
}
message DeleteNetworkCardRequest {
  int64 instance_id = 1;
  string nic_name = 2;
}

// ---- 数据盘 ----
message AutomationDataDisk {
  string hdd_name = 1;
  int32 hdd_size = 2;
  int32 hdd_flag = 3;
  int32 hdd_type = 4;
  string hdd_path = 5;
  string hdd_scsi = 6;
}
message ListDataDisksRequest { int64 instance_id = 1; }
message ListDataDisksResponse { repeated AutomationDataDisk items = 1; }
message AttachDataDiskRequest {
  int64 instance_id = 1;
  int32 hdd_size = 2;
  int32 hdd_type = 3;
}
message DetachDataDiskRequest {
  int64 instance_id = 1;
  string hdd_name = 2;
}
message DeleteDataDiskRequest {
  int64 instance_id = 1;
  string hdd_name = 2;
}

// ---- 光盘 ----
message AutomationISO {
  string iso_name = 1;
  string iso_file = 2;
  string iso_path = 3;
  string iso_hint = 4;
}
message ListISOsRequest { int64 instance_id = 1; }
message ListISOsResponse {
  repeated AutomationISO items = 1;
  // available_isos 为宿主机可挂载的 ISO 镜像文件名，供前端下拉选择
  repeated string available_isos = 2;
}
message MountISORequest {
  int64 instance_id = 1;
  string iso_file = 2;
  string iso_path = 3;
  string iso_hint = 4;
}
message UnmountISORequest {
  int64 instance_id = 1;
  string iso_name = 2;
}

// ---- 反向代理 ----
// AutomationReverseProxy 字段与平台 WebProxy 对齐：
//   domain 对外域名，backend_ip/backend_port 回源地址，ssl_enabled 是否 HTTPS。
message AutomationReverseProxy {
  int64 id = 1;
  string domain = 2;
  string backend_ip = 3;
  int32 backend_port = 4;
  bool ssl_enabled = 5;
  string description = 6;
}
message ListReverseProxiesRequest { int64 instance_id = 1; }
message ListReverseProxiesResponse { repeated AutomationReverseProxy items = 1; }
message CreateReverseProxyRequest {
  int64 instance_id = 1;
  string domain = 2;
  string backend_ip = 3;
  int32 backend_port = 4;
  bool ssl_enabled = 5;
  string description = 6;
}
message UpdateReverseProxyRequest {
  int64 instance_id = 1;
  int64 proxy_index = 2;
  string domain = 3;
  string backend_ip = 4;
  int32 backend_port = 5;
  bool ssl_enabled = 6;
  string description = 7;
}
message DeleteReverseProxyRequest {
  int64 instance_id = 1;
  int64 proxy_index = 2;
}

// ---- 启动顺序 ----
// AutomationBootOption efi_type 沿用平台语义：true=光盘，false=硬盘/网卡。
message AutomationBootOption {
  bool efi_type = 1;
  string efi_name = 2;
}
message GetBootOrderRequest { int64 instance_id = 1; }
message GetBootOrderResponse { repeated AutomationBootOption items = 1; }
message SetBootOrderRequest {
  int64 instance_id = 1;
  repeated AutomationBootOption items = 2;
}

// ---- PCI / USB 直通 ----
message AutomationPCIDevice {
  string pci_key = 1;
  string gpu_uuid = 2;
  string gpu_mdev = 3;
  string gpu_hint = 4;
}
message ListPCIDevicesRequest { int64 instance_id = 1; }
message ListPCIDevicesResponse { repeated AutomationPCIDevice items = 1; }
message SetupPCIDeviceRequest {
  int64 instance_id = 1;
  AutomationPCIDevice device = 2;
  // action: add / remove
  string action = 3;
}
message AutomationUSBDevice {
  string usb_key = 1;
  string vid_uuid = 2;
  string pid_uuid = 3;
  string usb_hint = 4;
}
message ListUSBDevicesRequest { int64 instance_id = 1; }
message ListUSBDevicesResponse { repeated AutomationUSBDevice items = 1; }
message SetupUSBDeviceRequest {
  int64 instance_id = 1;
  AutomationUSBDevice device = 2;
  // action: add / remove
  string action = 3;
}
